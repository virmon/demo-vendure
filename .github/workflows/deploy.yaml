name: Deploy Vendure
on:
  push:
    branches:
      - develop
      - main

env:
  GCLOUD_PROJECT: la-maison-mahal

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print env GCLOUD_PROJECT
        run: echo $GCLOUD_PROJECT
      - uses: actions/checkout@v3
      - uses: google-github-actions/auth@v3
        with:
          project_id: la-maison-mahal
          credentials_json: ${{ secrets.GCLOUD_DEVOPS_KEY }}
      - uses: 'google-github-actions/setup-gcloud@v3'
        with:
          project_id: la-maison-mahal
      - name: Build Docker container
        run: bash ./build-docker.sh la-maison-mahal

  deploy-production:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Deploying Prod ${{ matrix.instances.name }} with ${{ matrix.instances.secret }}
    needs: [ build ]
    strategy:
      matrix:
        instances: [
          { name: "la-maison-mahal", db: "prod-db", secret: "ENV_PROD", memory: "2G"},
          { name: "your-project-worker", db: "prod-db", secret: "ENV_PROD", memory: "2G"},
        ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: google-github-actions/auth@v3
        with:
          project_id: la-maison-mahal
          credentials_json: ${{ secrets.GCLOUD_DEVOPS_KEY }}
      - uses: 'google-github-actions/setup-gcloud@v3'
        with:
          project_id: la-maison-mahal
      - run: 'echo "$SECRET_VARS" > .env'
        env:
          SECRET_VARS: ${{secrets[matrix.instances.secret]}}
      - run: bash ./deploy.sh ${{ matrix.instances.name }} ${{ matrix.instances.db }} ${{ matrix.instances.memory }}

  deploy-test:
    if: ${{ github.ref == 'refs/heads/develop' }}
    name: Deploying Test ${{ matrix.instances.name }} with ${{ matrix.instances.secret }}
    needs: [ build ]
    strategy:
      matrix:
        instances: [
          { name: "la-maison-mahal", db: "test-db", secret: "ENV_TEST", memory: "1G"},
          { name: "your-project-test-worker", db: "test-db", secret: "ENV_TEST", memory: "1G"},
        ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: google-github-actions/auth@v3
        with:
          project_id: $GCLOUD_PROJECT
          credentials_json: ${{ secrets.GCLOUD_DEVOPS_KEY }}
      - uses: 'google-github-actions/setup-gcloud@v3'
        with:
          project_id: $GCLOUD_PROJECT
      - run: 'echo "$SECRET_VARS" > .env'
        env:
          SECRET_VARS: ${{secrets[matrix.instances.secret]}}
      - run: bash ./deploy.sh ${{ matrix.instances.name }} ${{ matrix.instances.db }} ${{ matrix.instances.memory }} $GCLOUD_PROJECT